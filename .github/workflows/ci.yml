name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json — specifying it
      # here as well makes the action fail with a version-mismatch error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Boundary rules live in eslint.config.mjs: the core engines must stay
      # pure, and the two domain modules must not import each other.
      - name: Lint (includes module boundary enforcement)
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # The financial and training invariants are unit tests, so a violation
      # fails here rather than surfacing as a wrong number in the app.
      - name: Test
        run: pnpm -r test

  build-web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json — specifying it
      # here as well makes the action fail with a version-mismatch error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catches Metro resolution problems that typecheck cannot see — notably
      # anything the bundler resolves differently from tsc.
      - name: Export web bundle
        working-directory: apps/mobile
        run: pnpm expo export --platform web --output-dir ../../.web-build

  database:
    name: Database — migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Runners have Docker, so this is where the schema is actually executed
      # rather than merely parsed. Postgres only — the full stack is not needed.
      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --level warning

      # The RLS and ledger invariants. These are the tests that cannot be run
      # without a real database: cross-user isolation, the ownership-reassignment
      # attack, the composite-FK rejection, and the deferred balance constraint.
      - name: pgTAP — schema, isolation, ledger integrity
        run: supabase test db
